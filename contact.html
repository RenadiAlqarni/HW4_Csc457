            <a href="index.html">Home</a>

            <a href="projects.html">Projects</a>
            <a href="contact.html" class="contact-link active" >Contact</a>
        </nav>
    </header>


<main class="contact-page">
    <p class="contact-subtitle">Have an idea?</p>

    <section class="contact-center">

        <h2>LET'S CONNECT!</h2>

        <p class="contact-description">
            I'm always open to connecting,
            collaborating, and sharing ideas.
        </p>

        <form action="#" method="get">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message"
                      name="message"
                      rows="5"
                      required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <p class="contact-or">OR</p>

        <a class="email-link"
           href="mailto:ralqarni12@hotmail.com">
            Email Me
        </a>

    </section>

</main>


    <footer class="site-footer">

    </footer>
